name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  estimators:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Panels are the balanced grids the estimators assume
        run: pytest tests/test_io.py -q

      - name: Estimators reproduce the published reference numbers
        run: pytest -q -m "not slow"

      - name: Placebo inference (39 constrained refits)
        run: pytest -q -m slow

      - name: Committed notebooks were executed and embed their figures
        run: pytest tests/test_notebooks.py -q
